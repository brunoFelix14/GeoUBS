<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | GeoUBS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/admin.css"></head><body>
<header><a href="/" class="brand"><span>✚</span> GeoUBS</a><div><span class="header-title">Painel de dados</span><a href="/" class="back">← Voltar ao mapa</a></div></header>
<main><section class="intro"><span>ADMINISTRAÇÃO</span><h1>Gerenciar Unidades Básicas de Saúde</h1><p>Cadastre e mantenha os dados que alimentam o mapa público. Os registros são salvos diretamente no PostgreSQL.</p></section>
<div class="layout"><section class="form-card"><div class="card-heading"><div><span>CADASTRO</span><h2 id="formTitle">Cadastrar nova UBS</h2></div><span class="badge">PostgreSQL</span></div><form id="ubsForm"><input type="hidden" id="id"><div class="grid"><label>Nome *<input id="nome" required placeholder="Ex: UBS Vila Nova"></label><label>CNES<input id="cnes" placeholder="Código CNES"></label></div><div class="grid"><label>Bairro<input id="bairro" placeholder="Ex: Vila Nova"></label><label>CEP<input id="cep" placeholder="00000-000"></label></div><label>Endereço *<div class="address-row"><input id="endereco" required placeholder="Rua, número, bairro..."><button type="button" id="geocodeBtn">Localizar</button></div></label><div class="grid"><label>Latitude<input id="latitude" type="number" step="any"></label><label>Longitude<input id="longitude" type="number" step="any"></label></div><div class="grid"><label>Telefone<input id="telefone" placeholder="(67) ..."></label><label>E-mail<input id="email" type="email" placeholder="unidade@saude.ms.gov.br"></label></div><label>Horário de funcionamento<input id="horario" placeholder="Segunda a sexta, 07:00 às 17:00"></label><label>Atendimento<input id="atendimento" placeholder="Descrição breve do atendimento"></label><div class="grid"><label>Serviços <small>separe por vírgula</small><input id="servicos" placeholder="Vacinação, Farmácia"></label><label>Especialidades <small>separe por vírgula</small><input id="especialidades" placeholder="Cardiologia, Pediatria"></label></div><label>Equipe <small>separe por vírgula</small><input id="equipe" placeholder="Médicos, Enfermeiros, ACS"></label><label>Descrição<textarea id="descricao" rows="3" placeholder="Informações adicionais"></textarea></label><label>URL da imagem<input id="imagem_url" placeholder="https://..."></label><label class="check"><input id="aberta" type="checkbox" checked> Unidade ativa / disponível</label><div class="actions"><button class="secondary" type="button" id="cancelBtn">Limpar</button><button class="primary" type="submit">Salvar UBS</button></div></form><div id="message"></div></section>
<section class="data-card"><div class="data-header"><div><span>BASE DE DADOS</span><h2>Unidades cadastradas</h2></div><button id="reloadBtn">↻ Atualizar</button></div><div id="stats" class="stats"></div><div id="adminList" class="admin-list"></div></section></div></main><script src="/static/js/admin.js"></script></body></html>
