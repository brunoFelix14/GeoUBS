<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>Administração | GeoUBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/admin.css?v=3">
</head>
<body>
<header><a href="/" class="brand">✚ <span>GeoUBS</span></a><a href="/" class="back">← Voltar ao mapa</a></header>
<main>
    <section class="intro"><span>PAINEL ADMINISTRATIVO</span><h1>Gerenciar Unidades Básicas de Saúde</h1><p>Cadastre, edite ou remova unidades. As alterações são salvas no PostgreSQL e aparecem no mapa.</p></section>
    <div class="layout">
        <section class="form-card">
            <h2 id="formTitle">Cadastrar nova UBS</h2>
            <form id="ubsForm">
                <input type="hidden" id="id">
                <div class="grid">
                    <label>Nome da unidade *<input id="nome" required maxlength="180" placeholder="Nome oficial da UBS"></label>
                    <label>CNES<input id="cnes" maxlength="30" placeholder="Código CNES"></label>
                </div>
                <label>Endereço *<div class="address-row"><input id="endereco" required maxlength="255" placeholder="Rua, número, bairro..."><button type="button" id="geocodeBtn">Localizar</button></div></label>
                <div class="grid">
                    <label>Bairro<input id="bairro" maxlength="100" placeholder="Bairro"></label>
                    <label>CEP<input id="cep" maxlength="12" placeholder="79600-000"></label>
                </div>
                <div class="grid">
                    <label>Latitude<input id="latitude" type="number" step="any" min="-90" max="90" placeholder="-20.79"></label>
                    <label>Longitude<input id="longitude" type="number" step="any" min="-180" max="180" placeholder="-51.70"></label>
                </div>
                <div class="grid">
                    <label>Telefone<input id="telefone" maxlength="30" placeholder="(67) 00000-0000"></label>
                    <label>E-mail<input id="email" type="email" maxlength="150" placeholder="unidade@exemplo.gov.br"></label>
                </div>
                <label>Horário de funcionamento<input id="horario" maxlength="200" placeholder="Segunda a sexta, 06:00 às 18:00"></label>
                <label>Descrição do atendimento<textarea id="atendimento" rows="3" placeholder="Resumo do atendimento ofertado"></textarea></label>
                <label>Serviços <small>separe por vírgula</small><input id="servicos" placeholder="Atenção Primária, Saúde da Família"></label>
                <div class="grid">
                    <label>Equipe <small>separe por vírgula</small><input id="equipe" placeholder="Médicos, Enfermeiros"></label>
                    <label>Especialidades <small>separe por vírgula</small><input id="especialidades" placeholder="Clínica médica"></label>
                </div>
                <label>Descrição adicional<textarea id="descricao" rows="3" placeholder="Informações complementares e observações"></textarea></label>
                <label>URL da imagem<input id="imagem_url" maxlength="500" placeholder="https://..."></label>
                <label class="check"><input id="aberta" type="checkbox" checked> Unidade ativa</label>
                <div class="actions"><button class="secondary" type="button" id="cancelBtn">Cancelar edição</button><button class="primary" type="submit">Salvar UBS</button></div>
            </form>
            <div id="message" role="status" aria-live="polite"></div>
        </section>
        <section class="data-card">
            <div class="data-header"><div><span>BASE DE DADOS</span><h2>Unidades cadastradas</h2></div><button id="reloadBtn" type="button">↻ Atualizar</button></div>
            <div id="stats" class="stats"></div>
            <div id="adminList" class="admin-list" aria-live="polite"></div>
        </section>
    </div>
</main>
<script src="/static/js/admin.js?v=3"></script>
</body>
</html>
